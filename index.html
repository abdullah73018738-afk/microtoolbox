<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="High-performance client-side web utility tools built with Web Workers and AST processing.">
  <meta name="theme-color" content="#6366f1">
  <title>MicroToolbox | Client-Side Developer Suite</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="logo">MicroToolbox</div>
    <div id="pwa-status" aria-live="polite" style="font-size: 0.8rem; color: var(--text-secondary);">Ready Offline</div>
  </header>

  <main>
    <nav class="tabs" role="tablist" aria-label="Tool Navigation">
      <button class="tab-btn active" role="tab" aria-selected="true" aria-controls="panel-minifier" id="tab-minifier">Code Minifier</button>
      <button class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-analyzer" id="tab-analyzer">Text Analyzer</button>
      <button class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-json" id="tab-json">JSON Formatter</button>
      <button class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-tags" id="tab-tags">Tag Generator</button>
    </nav>

    <!-- Code Minifier Panel -->
    <section id="panel-minifier" class="panel active" role="tabpanel" aria-labelledby="tab-minifier">
      <div class="controls">
        <label for="lang-select">Language:</label>
        <select id="lang-select" style="background: var(--bg-secondary); color: white; padding: 0.4rem; border-radius: 4px; border: 1px solid var(--bg-tertiary);">
          <option value="js">JavaScript (AST Tokenizer)</option>
          <option value="css">CSS</option>
          <option value="html">HTML</option>
        </select>
        <button id="btn-minify" class="btn" aria-label="Minify Code">
          <span>Minify Code</span>
          <div class="spinner" id="spin-minify" aria-hidden="true"></div>
        </button>
      </div>

      <div class="workspace">
        <div class="editor-container">
          <label for="minify-input">Source Code</label>
          <textarea id="minify-input" placeholder="Paste source code here..." spellcheck="false"></textarea>
        </div>
        <div class="editor-container">
          <label for="minify-output">Minified Output</label>
          <textarea id="minify-output" readonly placeholder="Output will appear here..." spellcheck="false"></textarea>
        </div>
      </div>
      
      <div class="controls">
        <button id="btn-copy-minify" class="btn btn-secondary">Copy Result</button>
      </div>
    </section>

    <!-- Text Analyzer Panel -->
    <section id="panel-analyzer" class="panel" role="tabpanel" aria-labelledby="tab-analyzer">
      <div class="editor-container">
        <label for="analyzer-input">Document Input</label>
        <textarea id="analyzer-input" placeholder="Type or paste text to perform async worker analysis..." spellcheck="true"></textarea>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="val" id="stat-words">0</div>
          <label>Words</label>
        </div>
        <div class="stat-card">
          <div class="val" id="stat-chars">0</div>
          <label>Characters</label>
        </div>
        <div class="stat-card">
          <div class="val" id="stat-lines">0</div>
          <label>Lines</label>
        </div>
        <div class="stat-card">
          <div class="val" id="stat-readtime">0m</div>
          <label>Read Time</label>
        </div>
      </div>
    </section>

    <!-- JSON Formatter Panel -->
    <section id="panel-json" class="panel" role="tabpanel" aria-labelledby="tab-json">
      <div class="controls">
        <button id="btn-format-json" class="btn">Format / Prettify</button>
        <button id="btn-minify-json" class="btn btn-secondary">Minify JSON</button>
      </div>
      <div class="workspace">
        <div class="editor-container">
          <label for="json-input">Raw JSON Input</label>
          <textarea id="json-input" placeholder='{"key": "value"}' spellcheck="false"></textarea>
        </div>
        <div class="editor-container">
          <label for="json-output">Processed JSON</label>
          <textarea id="json-output" readonly placeholder="Formatted output..." spellcheck="false"></textarea>
        </div>
      </div>
    </section>

    <!-- Tag Generator Panel -->
    <section id="panel-tags" class="panel" role="tabpanel" aria-labelledby="tab-tags">
      <div class="controls">
        <label for="tag-topic">Topic / Keywords:</label>
        <input type="text" id="tag-topic" placeholder="e.g. Web Development, Gaming, SEO" style="flex:1; padding: 0.6rem; border-radius: var(--border-radius); border: 1px solid var(--bg-tertiary); background: var(--bg-secondary); color: white;">
        <button id="btn-gen-tags" class="btn">Generate Tags</button>
      </div>
      <div class="workspace" style="grid-template-columns: 1fr; margin-top: 1rem;">
        <div class="editor-container">
          <label for="tag-output">Generated Tags & Hashtags</label>
          <textarea id="tag-output" readonly placeholder="Your tags will appear here..." spellcheck="false"></textarea>
        </div>
      </div>
      <div class="controls" style="margin-top: 1rem;">
        <button id="btn-copy-tags" class="btn btn-secondary">Copy Tags</button>
      </div>
    </section>
  </main>

  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
