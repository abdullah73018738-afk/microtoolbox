<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://abdullah73018738-afk.github.io/microtoolbox/word-counter.html" />
    <title>Online Word & Character Counter - MicroToolbox</title>
    <meta name="description" content="Free online Word & Character counter tool with real-time reading time calculator. Private and fast.">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-3 sm:p-6">

    <!-- Header with Back Button -->
    <header class="w-full max-w-2xl flex justify-between items-center my-4">
        <a href="index.html" class="text-cyan-400 font-bold hover:underline">← Back to MicroToolbox</a>
        <span class="text-xs text-gray-400">Word Counter</span>
    </header>

    <main class="w-full max-w-2xl">
        <section class="bg-gray-800 p-4 sm:p-5 rounded-xl shadow-lg border border-gray-700 mb-6">
            <h1 class="text-xl sm:text-2xl font-bold text-cyan-400 text-center mb-1">Word & Character Counter</h1>
            <p class="text-gray-400 text-center mb-4 text-xs">Real-time text analysis & reading time calculator</p>

            <textarea id="inputText" placeholder="Paste or type your text here..." 
                class="w-full h-40 p-3 rounded-lg bg-gray-900 text-gray-100 border border-gray-700 focus:outline-none focus:border-cyan-500 resize-none text-xs sm:text-sm"></textarea>

            <div class="grid grid-cols-3 gap-2 sm:gap-3 mt-4 text-center">
                <div class="bg-gray-900 p-2 sm:p-3 rounded-lg border border-gray-700">
                    <p class="text-[10px] sm:text-xs text-gray-400 uppercase">Words</p>
                    <p id="wordCount" class="text-base sm:text-lg font-bold text-cyan-400">0</p>
                </div>
                <div class="bg-gray-900 p-2 sm:p-3 rounded-lg border border-gray-700">
                    <p class="text-[10px] sm:text-xs text-gray-400 uppercase">Characters</p>
                    <p id="charCount" class="text-base sm:text-lg font-bold text-green-400">0</p>
                </div>
                <div class="bg-gray-900 p-2 sm:p-3 rounded-lg border border-gray-700">
                    <p class="text-[10px] sm:text-xs text-gray-400 uppercase">Reading Time</p>
                    <p id="readingTime" class="text-base sm:text-lg font-bold text-yellow-400">0m</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        const inputText = document.getElementById('inputText');
        const wordCount = document.getElementById('wordCount');
        const charCount = document.getElementById('charCount');
        const readingTime = document.getElementById('readingTime');

        inputText.addEventListener('input', () => {
            const text = inputText.value;
            charCount.textContent = text.length;
            const words = text.trim().split(/\s+/).filter(word => word.length > 0);
            const numWords = words.length;
            wordCount.textContent = numWords;
            const minutes = Math.ceil(numWords / 200);
            readingTime.textContent = numWords === 0 ? '0m' : `${minutes}m`;
        });
    </script>
</body>
</html>
