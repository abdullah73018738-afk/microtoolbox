<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://abdullah73018738-afk.github.io/microtoolbox/code-minifier.html" />
    <title>Free HTML, CSS, JS Code Minifier - MicroToolbox</title>
    <meta name="description" content="Compress your web code instantly with our free online HTML, CSS, and JavaScript Code Minifier.">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-3 sm:p-6">

    <header class="w-full max-w-2xl flex justify-between items-center my-4">
        <a href="index.html" class="text-cyan-400 font-bold hover:underline">← Back to MicroToolbox</a>
        <span class="text-xs text-gray-400">Code Minifier</span>
    </header>

    <main class="w-full max-w-2xl">
        <section class="bg-gray-800 p-4 sm:p-5 rounded-xl shadow-lg border border-gray-700 mb-6">
            <h1 class="text-xl sm:text-2xl font-bold text-cyan-400 text-center mb-1">Code Minifier</h1>
            <p class="text-gray-400 text-center mb-4 text-xs">Compress HTML, CSS, and JS code instantly</p>

            <textarea id="minifyInput" placeholder="Paste your code here..." 
                class="w-full h-36 p-3 rounded-lg bg-gray-900 text-gray-100 border border-gray-700 focus:outline-none focus:border-cyan-500 font-mono text-xs"></textarea>

            <button id="minifyBtn" class="w-full mt-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 rounded-lg transition text-xs sm:text-sm">
                Minify Code
            </button>

            <div class="mt-4">
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs text-gray-400 font-semibold">MINIFIED OUTPUT:</label>
                    <button id="copyBtn" class="text-xs text-cyan-400 font-semibold">Copy Code</button>
                </div>
                <textarea id="minifyOutput" readonly placeholder="Minified code will appear here..." 
                    class="w-full h-28 p-3 rounded-lg bg-gray-900 text-green-400 border border-gray-700 font-mono text-xs whitespace-pre-wrap break-all resize-none"></textarea>
            </div>
        </section>
    </main>

    <script>
        const minifyInput = document.getElementById('minifyInput');
        const minifyBtn = document.getElementById('minifyBtn');
        const minifyOutput = document.getElementById('minifyOutput');
        const copyBtn = document.getElementById('copyBtn');

        minifyBtn.addEventListener('click', () => {
            let code = minifyInput.value;
            if (!code.trim()) return;
            let minified = code.replace(/\/\*[\s\S]*?\*\/|([^:]|^)\/\//g, '').replace(/\s+/g, ' ').replace(/\s*([{}:;,=+\-*/<>])\s*/g, '$1').trim();
            minifyOutput.value = minified;
        });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(minifyOutput.value);
            copyBtn.textContent = 'Copied!';
            setTimeout(() => { copyBtn.textContent = 'Copy Code'; }, 2000);
        });
    </script>
</body>
</html>
